<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="#090909"/>

  <!-- Glow -->
  <circle cx="256" cy="256" r="130"
          fill="url(#greenGradient)"
          opacity="0.18"
          filter="url(#glow)"/>

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="110"
          fill="none"
          stroke="url(#greenGradient)"
          stroke-width="12"
          opacity="0.8"/>

  <!-- Open Book -->
  <path
    d="M180 190
       Q230 165 256 190
       Q282 165 332 190
       V330
       Q282 305 256 330
       Q230 305 180 330 Z"
    fill="url(#greenGradient)"/>

  <!-- AI Nodes -->
  <circle cx="256" cy="210" r="10" fill="#090909"/>
  <circle cx="220" cy="250" r="8" fill="#090909"/>
  <circle cx="292" cy="250" r="8" fill="#090909"/>
  <circle cx="256" cy="295" r="10" fill="#090909"/>

  <!-- Connections -->
  <line x1="256" y1="210" x2="220" y2="250"
        stroke="#090909" stroke-width="6"/>
  <line x1="256" y1="210" x2="292" y2="250"
        stroke="#090909" stroke-width="6"/>
  <line x1="220" y1="250" x2="256" y2="295"
        stroke="#090909" stroke-width="6"/>
  <line x1="292" y1="250" x2="256" y2="295"
        stroke="#090909" stroke-width="6"/>

</svg>
