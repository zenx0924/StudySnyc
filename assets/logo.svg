<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512">

    <defs>
        <linearGradient id="grad"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%">

            <stop offset="0%" stop-color="#4ADE80"/>
            <stop offset="100%" stop-color="#16A34A"/>

        </linearGradient>
    </defs>

    <!-- Background -->

    <rect
        width="512"
        height="512"
        rx="110"
        fill="#090909"/>

    <!-- Outer Ring -->

    <circle
        cx="256"
        cy="256"
        r="150"
        fill="none"
        stroke="url(#grad)"
        stroke-width="14"/>

    <!-- Book -->

    <path
        d="
        M165 180
        Q215 160 256 190
        Q297 160 347 180
        V325
        Q300 305 256 330
        Q212 305 165 325
        Z"
        fill="url(#grad)"/>

    <!-- AI Network -->

    <circle cx="256" cy="205" r="12" fill="#090909"/>

    <circle cx="220" cy="245" r="10" fill="#090909"/>

    <circle cx="292" cy="245" r="10" fill="#090909"/>

    <circle cx="256" cy="295" r="12" fill="#090909"/>

    <line
        x1="256"
        y1="205"
        x2="220"
        y2="245"
        stroke="#090909"
        stroke-width="7"/>

    <line
        x1="256"
        y1="205"
        x2="292"
        y2="245"
        stroke="#090909"
        stroke-width="7"/>

    <line
        x1="220"
        y1="245"
        x2="256"
        y2="295"
        stroke="#090909"
        stroke-width="7"/>

    <line
        x1="292"
        y1="245"
        x2="256"
        y2="295"
        stroke="#090909"
        stroke-width="7"/>

</svg>
